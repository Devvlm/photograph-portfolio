name = "portfolio-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true
# account_id is set via CLOUDFLARE_ACCOUNT_ID environment variable (not committed to git)

[vars]
CORS_ORIGIN = "https://dtrmndvisuals.com"

[[r2_buckets]]
binding = "PORTFOLIO_BUCKET"
bucket_name = "portfolio-media"
preview_bucket_name = "portfolio-media-dev"

[[kv_namespaces]]
binding = "TRANSLATIONS_KV"
id = "227487ed479f43b48bf80cc2c28df9b1"
preview_id = "37a4fb2aa16e437fbe8c86bff6941b5a"

# Secrets (set via: wrangler secret put SECRET_NAME)
# - ADMIN_PASSWORD_HASH
# - JWT_SECRET
# - RESEND_API_KEY
